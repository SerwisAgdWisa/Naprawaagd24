        <circle cx="50" cy="68" r="18" fill="url(#doorGrad)" stroke="#1e293b" stroke-width="3"/>
        <path d="M 40 60 A 10 10 0 0 1 58 60" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <!-- Ножки -->
